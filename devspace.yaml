# Docs: https://www.devspace.sh/docs/configuration/reference
version: v2beta1
name: devspace-sandbox

# Values come from the env first, then a question (source: all, the default), unless noted.
# Answers are cached (encrypted) in .devspace/cache.yaml; `devspace reset vars` clears them.
vars:
  REGISTRY: localhost:5111 # static value

  GREETING: # question: asked once, then cached
    question: What should the backend say?
    default: Hello from the backend, deployed by DevSpace
    alwaysResolve: false # don't ask on `devspace run <cmd>`, which doesn't use it

  APP_VERSION: # command: resolved on every run
    command: git rev-parse --short HEAD

  # env only: `FRONTEND_LOCAL_PORT=3005 devspace dev`, else the default.
  FRONTEND_LOCAL_PORT:
    source: env
    default: "3001"
  BACKEND_LOCAL_PORT:
    source: env
    default: "4000"
  DEBUG_LOCAL_PORT: # used by the debug profile
    source: env
    default: "9229"
  APP_HOST: # the Ingress host; needs a line in /etc/hosts
    source: env
    default: app.devspace.test

  HOSTS_ENTRY: # command var, used by `devspace run doctor`
    command: grep -v '^[[:space:]]*#' /etc/hosts | grep -qwF "${APP_HOST}" && echo present || echo missing

  APP_URL: http://${APP_HOST}:8081 # used by hooks and commands

# alwaysResolve: DevSpace 6.3.21 resolves every var on every run (unset counts as true, despite
# the docs saying false). `alwaysResolve: false` limits a var to runs that reference it.
# `devspace run <cmd>` only loads commands:, so GREETING's question stays out of it. dev, deploy,
# build and purge load the whole file, so they resolve every var used anywhere in it.

# Push to the k3d registry instead of DevSpace's own in-cluster registry.
localRegistry:
  enabled: false

# `devspace build` / the first step of `devspace deploy` and `devspace dev`
images:
  backend:
    image: ${REGISTRY}/backend
    context: ./backend
    dockerfile: ./backend/Dockerfile
  frontend:
    image: ${REGISTRY}/frontend
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
  frontend-dev: # same Dockerfile, stopped at the `dev` stage (node_modules + next dev)
    image: ${REGISTRY}/frontend-dev
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    target: dev

# Two deployment types side by side. In both, DevSpace swaps image refs that match images:
# above for the freshly built tags.
deployments:
  backend: # a local Helm chart
    helm:
      chart:
        name: ./charts/backend
      values:
        image: ${REGISTRY}/backend
  frontend: # plain manifests: the frontend Deployment and Service
    kubectl:
      manifests:
        - k8s/
  ingress: # inline, so ${APP_HOST} gets filled in (DevSpace doesn't touch vars in k8s/ files)
    kubectl:
      inlineManifest: |-
        # Traefik (bundled with k3s) serves this on the k3d load balancer, port 8081.
        # Only the frontend is exposed. Next.js proxies /api/* to the backend inside the cluster.
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: app
        spec:
          rules:
            - host: ${APP_HOST}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service: { name: frontend, port: { number: 3000 } }

# `devspace dev`: swap each container for a dev image, sync the source in, hot reload.
dev:
  backend:
    labelSelector: { app: backend }
    devImage: ${runtime.images.backend.image}:${runtime.images.backend.tag} # the built image, deps included
    command: ["npm", "run", "dev"] # node --watch
    env:
      - name: NODE_ENV # the image sets production
        value: development
      - name: GREETING
        value: ${GREETING}
      - name: APP_VERSION
        value: ${APP_VERSION}
    sync:
      - path: ./backend:/app
        excludePaths: [node_modules/] # inline: must never sync, the image provides it
        excludeFile: .devspaceignore # relative to the synced folder; local clutter (.env, logs, ...)
        # no startContainer: the image already has the code, and as the non-root `node` user
        # DevSpace's restart helper can't write its start file in the root-owned /.devspace
    ports:
      - port: "${BACKEND_LOCAL_PORT}:4000"
    logs: {} # stream this container's output into the `devspace dev` terminal (default options)
  frontend:
    labelSelector: { app: frontend }
    devImage: ${runtime.images.frontend-dev.image}:${runtime.images.frontend-dev.tag}
    command: ["npm", "run", "dev"]
    env:
      - name: WATCHPACK_POLLING # file events from sync don't always reach the watcher
        value: "true"
      - name: ALLOWED_DEV_ORIGINS # let `next dev` serve its JS to the ingress host
        value: ${APP_HOST}
    sync:
      - path: ./frontend:/app
        excludePaths: [node_modules/, .next/] # inline: must never sync, the image and next dev provide them
        excludeFile: .devspaceignore # relative to the synced folder; local clutter (.env, logs, ...)
        startContainer: true
    ports:
      - port: "${FRONTEND_LOCAL_PORT}:3000" # host 3000 is often taken; default localhost:3001 -> pod:3000
    logs: {} # stream this container's output into the `devspace dev` terminal (default options)

# Hooks: scripts DevSpace runs on events in its normal flow (build, deploy, sync, errors, ...).
# Events: before:|after:|error: + build|deploy|purge|initialSync|createPullSecrets|...,
# optionally narrowed by name (after:deploy:backend, after:initialSync:backend), plus
# start:|stop:|restart:|error: + sync|portForwarding. No `container` = runs locally.
hooks:
  - name: preflight-registry # fail fast with a clear message instead of a push error
    events: ["before:build"]
    command: 'curl -fs http://localhost:5111/v2/ >/dev/null 2>&1 || { echo "registry on localhost:5111 is down (try: devspace run doctor)"; exit 1; }'
    # not `silent: true`: in v6.3.21 that also hides the output when the hook fails

  - name: failure-hint
    events: ["error:build:*", "error:deploy:*"] # per-image/deployment events need :<name> or :*
    command: 'echo "Something failed. Try: devspace run doctor"'

  - name: backend-smoke-test # runs inside the backend pod; DevSpace waits for the container first
    events: ["after:initialSync:backend"]
    container:
      labelSelector: { app: backend }
    command: |
      for i in $(seq 30); do wget -qO- http://localhost:4000/api/health && echo && exit 0; sleep 1; done
      echo "backend never became healthy"; exit 1

  - name: ready-banner
    events: ["after:initialSync:frontend"]
    command: 'echo "Ready: ${APP_URL}"'

# Pipelines vs commands: both are shell scripts, but only pipelines get DevSpace's functions
# (build_images, create_deployments, start_dev, wait_pod, ...). Rule of thumb: if it builds,
# deploys or starts dev mode, it's a pipeline; anything else is a command.
#
# pipelines: `devspace dev|deploy|build|purge` each run the pipeline of the same name, and
# `devspace run-pipeline <name>` runs a custom one. Only `purge` is overridden here; the others
# use the built-in defaults. The default `dev` is roughly:
#   run_dependencies --all; ensure_pull_secrets --all; build_images --all
#   create_deployments --all; start_dev --all
# Defining `pipelines: dev:` replaces that default.
pipelines:
  purge:
    run: source ./pipelines/purge.sh # the script lives in its own file

# commands: shortcuts run with `devspace run <name>`, like `scripts` in package.json. Plain
# shell with vars filled in; to build or deploy they'd have to call `devspace` themselves.
commands:
  open:
    description: Print the app URL
    command: echo "${APP_URL}"

  doctor:
    section: Troubleshooting
    description: Check the /etc/hosts entry, the k3d cluster and the image registry
    command: ./scripts/doctor.sh "${HOSTS_ENTRY}" "${APP_HOST}"

  logs:
    section: Debugging
    description: "Follow a service's logs. Usage: devspace run logs backend|frontend"
    command: | # $1, not ${1}: DevSpace reads ${...} as one of its own vars
      [ -n "$1" ] || { echo "usage: devspace run logs backend|frontend"; exit 1; }
      devspace logs --follow --label-selector "app=$1"

  shell:
    section: Debugging
    description: "Open a shell in a service's pod. Usage: devspace run shell backend|frontend"
    command: | # $1, not ${1}: DevSpace reads ${...} as one of its own vars
      [ -n "$1" ] || { echo "usage: devspace run shell backend|frontend"; exit 1; }
      devspace enter --label-selector "app=$1"

  set-admin-token:
    section: Admin
    description: Set the admin password for reset-visits (backend-admin Secret) and restart the backend; empty removes it
    command: ./scripts/set-admin-token.sh ${DEVSPACE_NAMESPACE}

  reset-visits:
    section: Admin
    description: Reset the visit counter; asks for the admin password only if one is set
    command: ./scripts/reset-visits.sh ${DEVSPACE_NAMESPACE} ${APP_URL}
    after: '[ -n "$COMMAND_ERROR" ] && echo "reset failed: wrong admin password, or the app is unreachable (try: devspace run doctor)" || true'

# Profiles: named changes to this file, turned on with `-p <name>` (e.g. `devspace dev -p debug`).
# `devspace print -p <name>` shows the resulting config.
profiles:
  - name: debug
    description: Backend with the Node inspector, forwarded to localhost:9229 (DEBUG_LOCAL_PORT)
    patches:
      - op: replace
        path: dev.backend.command
        value: ["node", "--inspect=0.0.0.0:9229", "--watch", "server.js"]
      - op: add # on a list, add appends
        path: dev.backend.ports
        value: { port: "${DEBUG_LOCAL_PORT}:9229" }
