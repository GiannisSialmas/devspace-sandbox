# Docs: https://www.devspace.sh/docs/configuration/reference
version: v2beta1
name: devspace-sandbox

# Values come from the env first, then a question (source: all, the default), unless noted.
# Answers are cached (encrypted) in .devspace/cache.yaml; `devspace reset vars` clears them.
vars:
  REGISTRY: localhost:5111 # static value

  GREETING: # question: asked once, then cached
    question: What should the backend say?
    default: Hello from the backend, deployed by DevSpace

  APP_VERSION: # command: resolved on every run
    command: git rev-parse --short HEAD

  # env only: `FRONTEND_LOCAL_PORT=3005 devspace dev`, else the default.
  FRONTEND_LOCAL_PORT:
    source: env
    default: "3001"
  BACKEND_LOCAL_PORT:
    source: env
    default: "4000"
  APP_HOST: # the Ingress host; needs a line in /etc/hosts
    source: env
    default: app.devspace.test

# Push to the k3d registry instead of DevSpace's own in-cluster registry.
localRegistry:
  enabled: false

# `devspace build` / the first step of `devspace deploy` and `devspace dev`
images:
  backend:
    image: ${REGISTRY}/backend
    context: ./backend
    dockerfile: ./backend/Dockerfile
  frontend:
    image: ${REGISTRY}/frontend
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
  frontend-dev: # same Dockerfile, stopped at the `dev` stage (node_modules + next dev)
    image: ${REGISTRY}/frontend-dev
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    target: dev

# Plain manifests. DevSpace swaps image refs that match images: above for the freshly built tags.
deployments:
  app: # the backend and frontend Deployments and Services
    kubectl:
      manifests:
        - k8s/
  ingress: # inline, so ${APP_HOST} gets filled in (DevSpace doesn't touch vars in k8s/ files)
    kubectl:
      inlineManifest: |-
        # Traefik (bundled with k3s) serves this on the k3d load balancer, port 8081.
        # Only the frontend is exposed. Next.js proxies /api/* to the backend inside the cluster.
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: app
        spec:
          rules:
            - host: ${APP_HOST}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service: { name: frontend, port: { number: 3000 } }

# `devspace dev`: swap each container for a dev image, sync the source in, hot reload.
dev:
  backend:
    labelSelector: { app: backend }
    devImage: ${runtime.images.backend.image}:${runtime.images.backend.tag} # the built image, deps included
    command: ["npm", "run", "dev"] # node --watch
    env:
      - name: NODE_ENV # the image sets production
        value: development
      - name: GREETING
        value: ${GREETING}
      - name: APP_VERSION
        value: ${APP_VERSION}
    sync:
      - path: ./backend:/app
        excludePaths: [node_modules/] # the image provides it
        # no startContainer: the image already has the code, and as the non-root `node` user
        # DevSpace's restart helper can't write its start file in the root-owned /.devspace
    ports:
      - port: "${BACKEND_LOCAL_PORT}:4000"
    logs: {} # stream this container's output into the `devspace dev` terminal (default options)
  frontend:
    labelSelector: { app: frontend }
    devImage: ${runtime.images.frontend-dev.image}:${runtime.images.frontend-dev.tag}
    command: ["npm", "run", "dev"]
    env:
      - name: WATCHPACK_POLLING # file events from sync don't always reach the watcher
        value: "true"
      - name: ALLOWED_DEV_ORIGINS # let `next dev` serve its JS to the ingress host
        value: ${APP_HOST}
    sync:
      - path: ./frontend:/app
        excludePaths: [node_modules/, .next/] # the image and next dev provide them
        startContainer: true
    ports:
      - port: "${FRONTEND_LOCAL_PORT}:3000" # host 3000 is often taken; default localhost:3001 -> pod:3000
    logs: {} # stream this container's output into the `devspace dev` terminal (default options)
