apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: {{ .Values.image }}
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: GREETING
              value: {{ .Values.greeting | quote }}
            - name: ADMIN_TOKEN # set with `devspace run set-admin-token`; no Secret = no password needed
              valueFrom:
                secretKeyRef: { name: backend-admin, key: token, optional: true }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
