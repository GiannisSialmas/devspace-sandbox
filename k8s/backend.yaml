apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: localhost:5111/backend # tag is set by DevSpace
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: GREETING
              value: "Hello from the backend, deployed by DevSpace"
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 4000
      targetPort: 4000
